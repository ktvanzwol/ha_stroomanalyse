[project]
name = "ha-stroomanalyse"
version = "0.1.0"
description = "Export Home Assistant energy statistics to a CSV for the JeroenNL stroomanalyse"
readme = "README.md"
authors = [
    { name = "Karsten van Zwol", email = "karsten.van.zwol@emerson.com" }
]
requires-python = ">=3.14"
dependencies = [
    "polars>=2.1.0",
]

[project.scripts]
ha-stroomanalyse = "ha_stroomanalyse.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
